name: Check resume

on:
  push:
    paths: ["resume/**", "scripts/check_resume.py"]
  pull_request:
    paths: ["resume/**", "scripts/check_resume.py"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_resume.py
